l_russian:
 new_usa_pacify_mexican_turmoil.1.t: "[USA.GetNameDefCap] требует стать нашим протекторатом"
 new_usa_pacify_mexican_turmoil.1.desc: "Президент [USA.GetLeader] вызвал нашего посла, чтобы передать перечень требований американского правительства. Среди них — особые консультативные права для [USA.GetAdjective] посла. По существу, эти права давали бы [USA.GetAdjective] правительству право вето на любое принимаемое нами решение.\n\nВ случае нашего отказа, говорится далее в ноте, [USA.GetAdjective] правительство будет вынуждено «принять меры, которые сочтёт необходимыми для обеспечения национальной безопасности»."
 new_usa_pacify_mexican_turmoil.1.a: "Мы должны принять неприемлемое, чтобы избежать кровопролития."
 new_usa_pacify_mexican_turmoil.1.b: "Никогда!"
 new_usa_pacify_mexican_turmoil.2.t: "[MEX.GetLeader] соглашается"
 new_usa_pacify_mexican_turmoil.2.desc: "Осознав безнадёжность своего положения, правительство [MEX.GetLeader] приняло наше предложение и согласилось консультироваться с нами перед принятием любого крупного политического решения."
 new_usa_pacify_mexican_turmoil.2.a: "Судьба предначертана."
 new_usa_pacify_mexican_turmoil.3.t: "[MEX.GetLeader] отказывается"
 new_usa_pacify_mexican_turmoil.3.desc: "В пространной речи, напоминая о подвигах прошлых поколений мексиканцев перед лицом «открытой американской агрессии», [MEX.GetLeader] отказался даже рассматривать наши запросы и сообщил нашему послу, что мексиканский народ никогда не склонится перед иностранными захватчиками."
 new_usa_pacify_mexican_turmoil.3.a: "Это не имеет значения — судьба пробьёт себе дорогу!"
 new_usa_pacify_mexican_turmoil.3.b: "Война сейчас не в наших интересах."
 
 new_usa_preempt_a_southern_invasion.1.t: "[USA.GetNameDefCap] требует контроля над внешней политикой"
 new_usa_preempt_a_southern_invasion.1.desc: "[USA.GetAdjective] посол передал ноту от президента [USA.GetLeader] с уведомлением о том, что его правительство ожидает нашей консультации по всем будущим решениям в области внешней политики — «в интересах продолжения мира и доброй воли между нашими нациями»."
 new_usa_preempt_a_southern_invasion.1.a: "У нас нет выбора."
 new_usa_preempt_a_southern_invasion.1.b: "Мы выстоим!"
 new_usa_preempt_a_southern_invasion.2.t: "[From.GetNameDefCap] принимает подчинение"
 new_usa_preempt_a_southern_invasion.2.desc: "Правительство [From.GetLeader] согласилось с нашими требованиями и позволит нашему послу иметь право вето на любое принимаемое им крупное политическое решение."
 new_usa_preempt_a_southern_invasion.2.a: "Мудрый выбор."
 new_usa_preempt_a_southern_invasion.3.t: "[From.GetNameDefCap] отказывается"
 new_usa_preempt_a_southern_invasion.3.desc: "[From.GetLeader] отреагировал на нашу дипломатическую ноту с глубоким возмущением. В своём ответе он заявил, что [From.GetNameDef] обладает долгой и славной историей независимости и суверенитета и никогда не позволит иностранной державе навязывать ей свою волю.\n\nОн также призвал президента [USA.GetLeader] взвесить последствия войны по данному вопросу, которая неизбежно представит [USA.GetNameDef] крупнейшей угрозой миру и повлечёт непредсказуемые последствия."
 new_usa_preempt_a_southern_invasion.3.a: "Смелые слова от столь слабого."
 new_usa_preempt_a_southern_invasion.3.b: "Возможно, он прав."
 
 new_usa_central_american_bastion.1.t: "[USA.GetNameDefCap] требует немедленного подчинения"
 new_usa_central_american_bastion.1.desc: "[USA.GetAdjective] посол передал ноту от президента [USA.GetLeader], в которой говорится, что мы должны немедленно передать контроль над своей внешней политикой [USA.GetNameDefCap], иначе столкнёмся с неизбежным ударом [USA.GetAdjective] сил."
 new_usa_central_american_bastion.1.a: "У нас нет выбора."
 new_usa_central_american_bastion.1.b: "Мы выстоим."
 new_usa_central_american_bastion.2.t: "[From.GetNameDefCap] принимает подчинение"
 new_usa_central_american_bastion.2.desc: "Правительство [From.GetLeader] согласилось с нашими требованиями и подчинит своё правительство нам."
 new_usa_central_american_bastion.2.a: "Мудрый выбор."
 new_usa_central_american_bastion.3.t: "[From.GetNameDefCap] отказывается"
 new_usa_central_american_bastion.3.desc: "[From.GetLeader] отреагировал на нашу дипломатическую ноту с глубоким возмущением. В своём ответе он заявил, что [From.GetNameDef] обладает долгой и славной историей независимости и суверенитета и никогда не позволит иностранной державе навязывать ей свою волю.\n\nОн также призвал президента [USA.GetLeader] взвесить последствия войны по данному вопросу, которая неизбежно представит [USA.GetNameDef] крупнейшей угрозой миру и повлечёт непредсказуемые последствия."
 new_usa_central_american_bastion.3.a: "Смелые слова от столь слабого."
 new_usa_central_american_bastion.3.b: "Пожалуй, мы зашли слишком далеко."
 
 new_usa_dominate_south_america.1.t: "[USA.GetNameDefCap] требует немедленного подчинения"
 new_usa_dominate_south_america.1.desc: "[USA.GetAdjective] посол передал ноту от президента [USA.GetLeader], в которой говорится, что мы должны немедленно передать контроль над своей внешней политикой [USA.GetNameDefCap], иначе столкнёмся с неизбежным ударом [USA.GetAdjective] сил."
 new_usa_dominate_south_america.1.a: "У нас нет выбора."
 new_usa_dominate_south_america.1.b: "Мы выстоим."
 new_usa_dominate_south_america.2.t: "[From.GetNameDefCap] принимает подчинение"
 new_usa_dominate_south_america.2.desc: "Правительство [From.GetLeader] согласилось с нашими требованиями и подчинит своё правительство нам."
 new_usa_dominate_south_america.2.a: "Мудрый выбор."
 new_usa_dominate_south_america.3.t: "[From.GetNameDefCap] отказывается"
 new_usa_dominate_south_america.3.desc: "[From.GetLeader] отреагировал на нашу дипломатическую ноту с глубоким возмущением. В своём ответе он заявил, что [From.GetNameDef] обладает долгой и славной историей независимости и суверенитета и никогда не позволит иностранной державе навязывать ей свою волю.\n\nОн также призвал президента [USA.GetLeader] взвесить последствия войны по данному вопросу, которая неизбежно представит [USA.GetNameDef] крупнейшей угрозой миру и повлечёт непредсказуемые последствия."
 new_usa_dominate_south_america.3.a: "Смелые слова от столь слабого."
 new_usa_dominate_south_america.3.b: "Пожалуй, мы зашли слишком далеко."
 
 new_usa_bribe_the_canadian_government.1.t: "Правительство [USA.GetAdjective] предлагает оплату за Коридор"
 new_usa_bribe_the_canadian_government.1.desc: "[USA.GetNameDefCap] направила сообщение, в котором заявляет о готовности направить значительную долю своего экономического выпуска в нашу страну в обмен на передачу Канадского коридора, отделяющего континентальные США от Аляски. Если мы согласимся, то получим очень большое количество ресурсов."
 new_usa_bribe_the_canadian_government.1.a: "Это справедливое предложение"
 new_usa_bribe_the_canadian_government.1.b: "Заманчиво, но мы не будем торговать нашей землёй"
 new_usa_bribe_the_canadian_government.2.t: "[FROM.GetNameDefCap] соглашается"
 new_usa_bribe_the_canadian_government.2.desc: "[FROM.GetAdjective] правительство согласилось уступить контроль над перешейком."
 new_usa_bribe_the_canadian_government.2.a: "Поистине отличная сделка!"
 new_usa_bribe_the_canadian_government.3.t: "[FROM.GetNameDefCap] отказывается от взятки"
 new_usa_bribe_the_canadian_government.3.desc: "[FROM.GetAdjective] правительство отклонило наше щедрое предложение."
 new_usa_bribe_the_canadian_government.3.a: "Попытка не пытка"
 
 new_usa_secure_corridor.1.t: "[USA.GetNameDefCap] требует контроля над Коридором"
 new_usa_secure_corridor.1.desc: "[USA.GetNameDefCap] направила по защищённым каналам очень жёсткое сообщение с требованием немедленно передать все территории в пределах Канадского коридора. В нём далее говорится, что если контроль не будет уступлен, [USA.GetAdjective] правительство будет вынуждено прибегнуть к более решительным мерам для обеспечения собственной безопасности."
 new_usa_secure_corridor.1.a: "Это того не стоит. Мы выполним требование."
 new_usa_secure_corridor.1.b: "Мы не уступим нашу землю без боя!"
 new_usa_secure_corridor.2.t: "[FROM.GetNameDefCap] соглашается передать Коридор"
 new_usa_secure_corridor.2.desc: "Вскоре после получения нашего сообщения [FROM.GetAdjective] правительство прислало быстрый ответ, в котором выразило стремление к продолжению мира между нашими двумя нациями. Немедленно, с этого момента, контроль над Коридором переходит к нам в обмен на гарантии отказа от дальнейшего конфликта."
 new_usa_secure_corridor.2.a: "Просто, легко и без кровопролития."
 new_usa_secure_corridor.3.t: "[FROM.GetNameDefCap] отказывается передавать контроль над Коридором"
 new_usa_secure_corridor.3.desc: "[FROM.GetAdjective] правительство категорически отвергло нашу позицию и дало понять, что любая попытка нарушить их территориальный суверенитет встретит силу. В ответе было выражено желание не создавать новых конфликтов, подчёркнуто стремление поддерживать мирные отношения между нашими странами, и выражена надежда, что этот инцидент просто пройдёт без дальнейших трений."
 new_usa_secure_corridor.3.a: "Мы им ещё покажем трения."
 new_usa_secure_corridor.3.b: "Мы зашли слишком далеко."
 
 new_usa_bargain_canada.1.t: "[USA.GetNameDefCap] предлагает купить [CAN.GetNameDefCap]"
 new_usa_bargain_canada.1.desc: "[USA.GetAdjective] посланники передали сообщение от Президента о том, что [USA.GetNameDefCap] серьёзно рассматривает возможность выкупа [CAN.GetNameDefCap] и готова заплатить за это весьма приличную сумму. Если [ENG.GetAdjective] правительство согласится на сделку, выплата вполне оправдает её."
 new_usa_bargain_canada.1.a: "Одобрить сделку"
 new_usa_bargain_canada.1.b: "Вежливо отклонить предложение"
 new_usa_bargain_canada.2.t: "[FROM.GetNameDefCap] соглашается на продажу [CAN.GetNameDefCap]"
 new_usa_bargain_canada.2.desc: "Мы получили подтверждение от [FROM.GetAdjective] правительства, что наше предложение о покупке [CAN.GetNameDefCap] одобрено!"
 new_usa_bargain_canada.2.a: "Отлично!"
 new_usa_bargain_canada.3.t: "[FROM.GetNameDefCap] отклоняет сделку"
 new_usa_bargain_canada.3.desc: "К сожалению, наше предложение о покупке [CAN.GetNameDefCap] у [FROM.GetNameDefCap] было оперативно, хотя и любезно, отклонено. В письме с подтверждением этого также ясно выражено стремление к сотрудничеству, которым [FROM.GetAdjective] дорожит в отношениях с нами, и желание продолжать его в любом случае."
 new_usa_bargain_canada.3.a: "По крайней мере, они не нагрубили"
 
 new_usa_buy_newfoundland.1.t: "[USA.GetNameDefCap] предлагает купить Ньюфаундленд"
 new_usa_buy_newfoundland.1.desc: "После получения Канады [USA.GetAdjective] администрация вновь обратилась с предложением купить территории Ньюфаундленда и Лабрадора для обеспечения континентальной целостности."
 new_usa_buy_newfoundland.1.a: "Почему бы и нет"
 new_usa_buy_newfoundland.1.b: "Мы оставим его у себя"
 new_usa_buy_newfoundland.2.t: "[FROM.GetNameDefCap] соглашается продать нам Ньюфаундленд"
 new_usa_buy_newfoundland.2.desc: "[FROM.GetNameDefCap] согласилась с нашими окончательными условиями по дальнейшей покупке оставшейся территории канадцев."
 new_usa_buy_newfoundland.2.a: "Северная Америка наша"
 new_usa_buy_newfoundland.3.t: "[FROM.GetNameDefCap] отклоняет наш последний запрос"
 new_usa_buy_newfoundland.3.desc: "К сожалению, наше предложение о покупке Ньюфаундленда у [FROM.GetNameDefCap] было оперативно, хотя и любезно, отклонено. В письме с подтверждением этого также ясно выражено стремление к сотрудничеству, которым [FROM.GetAdjective] дорожит в отношениях с нами, и желание продолжать его в любом случае."
 new_usa_buy_newfoundland.3.a: "Жаль"
 
 new_usa_conquer_north.1.b.tt: "§Y[FROM.GetNameDefCap]§! может немедленно §Rобъявить войну!§!"
 new_usa_conquer_north.1.t: "[FROM.GetNameDefCap] требует немедленного подчинения"
 new_usa_conquer_north.1.desc: "[FROM.GetAdjective] правительство направило в нашу столицу требование о немедленном подчинении нашей страны им. Эта наглая угроза, судя по всему, хорошо подкреплена: в требовании приводятся различные примеры потенциальных целей, которые [FROM.GetAdjective] армия намерена ударить первыми в случае применения силы.\n\nКак мы ответим?"
 new_usa_conquer_north.1.a: "Всё безнадёжно..."
 new_usa_conquer_north.1.b: "Если им нужен бой — они его получат!"
 new_usa_conquer_north.2.t: "[FROM.GetNameDefCap] принял наши требования"
 new_usa_conquer_north.2.desc: "Только что поступило сообщение о том, что [FROM.GetAdjective] правительство уступило нашим требованиям и теперь объявило себя под нашим прямым надзором."
 new_usa_conquer_north.2.a: "Отлично"
 new_usa_conquer_north.3.t: "[FROM.GetNameDefCap] отказывается подчиняться"
 new_usa_conquer_north.3.desc: "В проявлении забавной смелости и безрассудства [FROM.GetAdjective] правительство публично отвергло наши взвешенные требования. Однако им следовало понимать, что эти требования делались не в вакууме, и мы намерены их выполнить. Война была не нашим первым выбором, но теперь это единственный выбор."
 new_usa_conquer_north.3.a: "Они знали, во что ввязываются"
 new_usa_conquer_north.3.b: "Они разоблачили наш блеф..."
 
 new_usa_carribean.1.t: "[FROM.GetNameDefCap] требует интеграции в [FROM.GetAdjective] сферу влияния"
 new_usa_carribean.1.desc: "[FROM.GetNameDefCap] публично заявила о претензии на нашу страну, указав на необходимость прочно ввести нашу внешнюю политику в их сферу влияния ради содействия взаимному процветанию и предотвращения возможного удара по [FROM.GetAdjective] территории.\n\nКак следует ответить?"
 new_usa_carribean.1.a: "Легче уступить"
 new_usa_carribean.1.b: "Мы не позволим запугивать себя"
 new_usa_carribean.2.t: "[FROM.GetNameDefCap] соглашается войти в нашу сферу влияния"
 new_usa_carribean.2.desc: "Мы получили сообщение из [FROM.GetAdjective] посольства о том, что, начиная с этого момента, [FROM.GetAdjective] правительство будет передавать нам все вопросы внешней политики для ознакомления и одобрения, фактически прочно войдя в [THIS.GetAdjective] сферу влияния."
 new_usa_carribean.2.a: "Просто и легко"
 new_usa_carribean.3.t: "[FROM.GetNameDefCap] отвергает наши требования"
 new_usa_carribean.3.desc: "К сожалению, [FROM.GetAdjective] правительство, судя по всему, решило не выполнять наши требования и не будет вступать в нашу сферу влияния. Хотя их решение принято, нам теперь самим нужно ответить.\n\nУгроза вторжения по-прежнему в силе?"
 new_usa_carribean.3.a: "Мы должны выполнить угрозу"
 new_usa_carribean.3.b: "Всё в порядке, мы прекрасно справимся и без них"
 
 new_usa_london_treaty.1.a.tt: "§YОсвободить наши колониальные владения§! в Центральной и Южной Америке."
 new_usa_london_treaty.1.t: "[FROM.GetNameDefCap] приглашает нас подписать Лондонский договор"
 new_usa_london_treaty.1.desc: "[FROM.GetAdjective] правительство выступило с грандиозным предложением об окончательном освобождении Карибского бассейна и Южной Америки от европейского колониализма. На конференции [FROM.GetAdjective] дипломаты с пафосом говорили о великой важности самоопределения народов их полушария и о том, что наши страны и без того имеют достаточно забот, чтобы заниматься ещё и поддержанием связей по всему глобусу, тем более что [FROM.GetNameDefCap] уже взяла на себя ответственность за мир и безопасность в регионе. Наши собственные владения в Америках будут освобождены от нашего влияния, если мы подпишем договор."
 new_usa_london_treaty.1.a: "Свобода для Америк давно назрела"
 new_usa_london_treaty.1.b: "Наши интересы поддерживают продолжение присутствия там"
 new_usa_london_treaty.2.t: "[FROM.GetNameDefCap] подписала Лондонский договор"
 new_usa_london_treaty.2.desc: "После долгих переговоров [FROM.GetAdjective] дипломат на конференции наконец согласился подписать договор и учредить свободные республики на их западных территориях. Великий день для свободы!"
 new_usa_london_treaty.2.a: "Дипломатия в действии"
 new_usa_london_treaty.3.t: "[FROM.GetNameDefCap] отказывается подписывать Лондонский договор"
 new_usa_london_treaty.3.desc: "Несмотря на наши усилия склонить на свою сторону державы, всё ещё участвующие в делах Нового Света, [FROM.GetNameDefCap] не согласилась освободить свои владения. Однако отношения пока остаются прохладными и не переросли в открытое охлаждение. Возможно, ещё есть время их переубедить."
 new_usa_london_treaty.3.a: "А что если сделать это выгодным для них?"
 new_usa_london_treaty.3.b: "Это бесполезно"
 new_usa_london_treaty.4.t: "[FROM.GetNameDefCap] предлагает плату за подписание договора"
 new_usa_london_treaty.4.desc: "Не сдаваясь, ведущий [FROM.GetAdjective] дипломат обратился к нам с предложением заплатить за отказ от наших владений в Новом Свете. Если мы подпишем Лондонский договор, они обязуются щедро нам заплатить."
 new_usa_london_treaty.4.a: "Вот это уже сделка стоящая"
 new_usa_london_treaty.4.b: "Заманчиво, но наши владения слишком важны"
 new_usa_london_treaty.5.t: "[FROM.GetNameDefCap] соглашается подписать за плату"
 new_usa_london_treaty.5.desc: "Наши дипломатические манёвры окупились, и нам наконец удалось получить подпись [FROM.GetAdjective] дипломата. Хотя ради этого пришлось рискнуть частью своих ресурсов, Америки стали чуть более свободными."
 new_usa_london_treaty.5.a: "Наконец-то"
 new_usa_london_treaty.6.t: "[FROM.GetNameDefCap] по-прежнему отказывается подписать"
 new_usa_london_treaty.6.desc: "Невзирая ни на что, [FROM.GetAdjective] дипломат отказался подписывать Лондонский договор. Нам нужно смириться с тем, что их влияние продолжит присутствовать в Америках."
 new_usa_london_treaty.6.a: "Жаль"
 new_usa_london_treaty.6.b: "Нет, это ещё не конец..."
 
 new_usa_shield_pan.1.t: "[FROM.GetNameDefCap] запрашивает непосредственное участие в защите Канала"
 new_usa_shield_pan.1.desc: "[FROM.GetNameDefCap] прислала нам письмо с военным атташе с просьбой вступить в тесный союз с ними и помочь в защите Панамского канала. В обмен мы получим финансовую поддержку и военную помощь."
 new_usa_shield_pan.1.a: "Это в наших интересах"
 new_usa_shield_pan.1.b: "Мы предпочли бы сохранить суверенитет"
 new_usa_shield_pan.2.t: "[FROM.GetNameDefCap] приняла наши запросы"
 new_usa_shield_pan.2.desc: "Ранее этим утром мы получили официальное коммюнике от [FROM.GetAdjective] правительства, сообщающее о том, что предложение об объединённой защите Канала и более тесных межгосударственных связях принято."
 new_usa_shield_pan.2.a: "Отлично"
 new_usa_shield_pan.3.t: "[FROM.GetNameDefCap] отклонила наш запрос"
 new_usa_shield_pan.3.desc: "Мы получили сообщение от [FROM.GetAdjective] правительства о том, что наш запрос о тесном партнёрстве в защите Панамского канала был отклонён. Камнем преткновения, судя по всему, стало ощущение утраты контроля над собственной страной."
 new_usa_shield_pan.3.a: "Нам придётся обезопасить его самим"
 new_usa_shield_pan.3.b: "Безопасность канала слишком важна"
 
 new_usa_monroe_neutrality.1.t: "[FROM.GetNameDefCap] запрашивает обязательства о мире"
 new_usa_monroe_neutrality.1.desc: "Наше [FROM.GetAdjective] посольство передало новое соглашение, которое [FROM.GetAdjective] президент направил [CAN.GetName], [MEX.GetName] и европейским великим державам с просьбой подписать обязательство о продолжении мира между нашими двумя нациями и обещание уважать независимость Америк."
 new_usa_monroe_neutrality.1.a: "Мы подпишем его"
 new_usa_monroe_neutrality.1.b: "Это звучит как угроза"
 new_usa_monroe_neutrality.2.t: "[FROM.GetNameDefCap] подписывает соглашение"
 new_usa_monroe_neutrality.2.desc: "Главный [FROM.GetAdjective] дипломат в столице только что передал нашему министру иностранных дел подписанную копию договора, направленного им всего несколько дней назад. Похоже, что в наше время с [FROM.GetNameDefCap] нас ожидает мир."
 new_usa_monroe_neutrality.2.a: "Замечательно"
 new_usa_monroe_neutrality.3.t: "[FROM.GetNameDefCap] отказывается подписывать соглашение"
 new_usa_monroe_neutrality.3.desc: "То ли наше сообщение было неправильно понято, то ли [FROM.GetAdjective] правительство действительно вынашивает планы навредить нам — так или иначе, наше мирное соглашение с [FROM.GetNameDefCap] было категорически отвергнуто. Что это будет означать для наших дипломатических отношений с ними в дальнейшем — пока неизвестно."
 new_usa_monroe_neutrality.3.a: "Наш враг раскрыт"
 
 new_usa_american_alliance.1.t: "[FROM.GetNameDefCap] приглашает нас вступить в Американский союз безопасности"
 new_usa_american_alliance.1.desc: "[FROM.GetNameDefCap] направила своих ведущих дипломатов, чтобы сообщить нам, что формирует военный альянс, ориентированный на защиту Америк, и хотела бы, чтобы [THIS.GetNameDefCap] вступила в него и вошла в солидарность с [FROM.GetAdjective] сферой."
 new_usa_american_alliance.1.a: "Это необходимый шаг для безопасности"
 new_usa_american_alliance.1.b: "Мы не будем связывать себя обязательствами перед [FROM.GetName]"
 new_usa_american_alliance.2.t: "[FROM.GetNameDefCap] присоединяется к Американскому союзу безопасности"
 new_usa_american_alliance.2.desc: "С включением [FROM.GetNameDefCap] в Американский союз безопасности наши возможности проецирования силы на континенте значительно возросли. Больше союзников и государств, разделяющих наше стремление к безопасности, означает, что любому потенциальному противнику придётся столкнуться со всеми нами сразу."
 new_usa_american_alliance.2.a: "Отлично"
 new_usa_american_alliance.3.t: "[FROM.GetNameDefCap] отказывается вступать в Американский союз безопасности"
 new_usa_american_alliance.3.desc: "Пока неясно — это высокомерие или недобрый умысел, но по какой бы то ни было причине [FROM.GetName] отклонила наше приглашение вступить в Американский союз безопасности. Это не только дипломатическая пощёчина, но и серьёзный повод задуматься о судьбе нашей национальной безопасности. Соседняя нация, не видящая пользы в помощи нашей взаимной обороне, вполне может в будущем стать угрозой."
 new_usa_american_alliance.3.a: "Тревожно"
 
 new_usa_vigilance_pact.1.t: "[FROM.GetNameDefCap] приглашает нас вступить в Межконтинентальный пакт бдительности"
 new_usa_vigilance_pact.1.desc: "Наше [FROM.GetAdjective] посольство получило сообщение о том, что [FROM.GetNameDefCap] инициировала создание формального военного кооперативного альянса, призванного мобилизовать Америки для взаимной обороны континентов."
 new_usa_vigilance_pact.1.a: "Мы вступим в этот пакт"
 new_usa_vigilance_pact.1.b: "Пусть у них будет свой пакт"
 new_usa_vigilance_pact.2.t: "[FROM.GetNameDefCap] присоединяется к Межконтинентальному пакту бдительности"
 new_usa_vigilance_pact.2.desc: "Только что мы получили сообщение из нашего посольства в [FROM.GetName] о том, что [FROM.GetAdjective] правительство официально приняло наше приглашение к МПБ и объявило о его поддержке. С их официальным вступлением в наш пакт взаимной обороны мы чувствуем себя спокойнее, зная, что на нашей стороне всё больше друзей."
 new_usa_vigilance_pact.2.a: "Приятно слышать"
 new_usa_vigilance_pact.3.t: "[FROM.GetNameDefCap] отказывается вступать в Межконтинентальный пакт бдительности"
 new_usa_vigilance_pact.3.desc: "В несколько предсказуемом шаге [FROM.GetAdjective] правительство признало наш новый военный альянс, но отказалось поднять свой флаг рядом с нашим. Хотя это и лишает пакт части его потенциальной силы, в долгосрочной перспективе это, пожалуй, даже к лучшему: его сплочённость не будет держаться на сторонах с неустойчивой решимостью, как в случае с [FROM.GetNameDefCap]."
 new_usa_vigilance_pact.3.a: "Ничего страшного"
 
 new_usa_purchase_gap.1.t: "[FROM.GetNameDefCap] предлагает продать Канадский коридор"
 new_usa_purchase_gap.1.desc: "[FROM.GetAdjective] правительство прислало нам выгодное предложение о покупке Западного коридора за приличную сумму. Наше сотрудничество, судя по всему, создало у них впечатление, что они могут просто купить у нас землю. ... Могут ли они? Возможно, это была бы хорошая сделка."
 new_usa_purchase_gap.1.a: "Это выгодная сделка"
 new_usa_purchase_gap.1.b: "Мы ценим предложение, но не заинтересованы"
 new_usa_purchase_gap.2.t: "[FROM.GetName] соглашается продать Канадский коридор"
 new_usa_purchase_gap.2.desc: "Наше предложение о покупке Канадского коридора у [FROM.GetNameDefCap] было получено и принято. Начиная с этого момента, западный перешеек находится под американским владением. Владения Америки на континенте наконец стали полностью непрерывными."
 new_usa_purchase_gap.2.a: "Это превосходно!"
 new_usa_purchase_gap.3.t: "[FROM.GetNameDefCap] отклоняет наше предложение о покупке Западного перешейка"
 new_usa_purchase_gap.3.desc: "К сожалению, наш дипломатический и экономический манёвр с целью покупки Канадского коридора натолкнулся на глухую стену. Хотя сегодня эта сделка не состоится, возможно, в будущем появится ещё один подходящий момент. А пока мы можем продолжать поддерживать добросердечные отношения с [FROM.GetAdjective] администрацией."
 new_usa_purchase_gap.3.a: "Жаль"
 
 new_usa_purchase_holdovers.1.a.tt: "§YПродать наши колониальные владения§! в Центральной и Южной Америке."
 new_usa_purchase_holdovers.1.t: "[FROM.GetNameDefCap] предлагает купить наши американские колонии"
 new_usa_purchase_holdovers.1.desc: "[FROM.GetAdjective] правительство предлагает купить наши оставшиеся колонии в Америках. Они предлагают за них хорошие деньги. Однако наши колониальные владения — не просто фишки, которыми можно разбрасываться. Любое решение расстаться с ними требует серьёзного обдумывания."
 new_usa_purchase_holdovers.1.a: "Мы принимаем сделку"
 new_usa_purchase_holdovers.1.b: "Мы не готовы расставаться с ними"
 new_usa_purchase_holdovers.2.t: "[FROM.GetNameDefCap] согласилась передать нам свои американские владения"
 new_usa_purchase_holdovers.2.desc: "Прекрасный день для свободы: колонии [FROM.GetNameDefCap] в Америках больше не будут под ярмом европейских держав. Наконец эти регионы отделились от Старого Света."
 new_usa_purchase_holdovers.2.a: "Отлично"
 new_usa_purchase_holdovers.3.t: "[FROM.GetNameDefCap] отклонила сделку"
 new_usa_purchase_holdovers.3.desc: "Хотя мы надеялись купить последние оставшиеся американские колонии [FROM.GetAdjective], нам придётся искать другую возможность в другой раз."
 new_usa_purchase_holdovers.3.a: "Жаль"
 
 new_usa_econ_1.2.t: "Политика экономического восстановления"
 new_usa_econ_1.2.desc: "По мере того как экономика страны начинает восстанавливаться, нам нужно решить, как к этому подходить. Будет ли правительство активно вмешиваться в экономику, стараясь запустить её быстрее, или отступит и постарается по возможности дать ей восстановиться естественным образом?"
 new_usa_econ_1.2.a: "Естественное восстановление"
 new_usa_econ_1.2.a.tt: "Будет работать к завершению фокуса §Y$USA_natural_recovery$§!. \n\n§YЭтот фокус улучшит рост, но займёт больше времени.§!"
 #new_usa_econ_1.2.a.tt_2: "Время завершения: §Y399§! дней\n§YЭффект§!:\n Ежедневные политические затраты: §G-0.45§!\n Эффективность добычи ресурсов: §G+40.0%§!\n Коэффициент призывного населения: §G+30.0%§!\n Коэффициент потребительских товаров: §Y-10.0%§!\n Стабильность §G+5.0%§!\n Военная поддержка §G+5.0%§!\n Скорость строительства: §G+5.0%§!\n Производство"
 new_usa_econ_1.2.b: "Ускоренное восстановление"
 new_usa_econ_1.2.b.tt: "Будет работать к завершению фокуса §Y$USA_accelerated_recovery$§!. \n\n§YЭтот фокус будет полезен и быстр.§!"
 
 new_usa_econ_2.2.t: "Политика экономического роста"
 new_usa_econ_2.2.desc: "Экономика страны восстанавливается быстро и эффективно и вскоре вернётся к прежней славе. Позволить ли ей продолжать идти нынешним путём, или применить стратегические вмешательства, чтобы скорее привести её в норму?"
 new_usa_econ_2.2.a: "Орёл свободного рынка"
 new_usa_econ_2.2.a.tt: "Будет работать к завершению фокуса §Y$USA_eagle_of_the_free_market$§!. \n\n§YЭтот фокус максимизирует рост, но займёт очень много времени!§!"
 new_usa_econ_2.2.b: "Своевременное вмешательство"
 new_usa_econ_2.2.b.tt: "Будет работать к завершению фокуса §Y$USA_timely_intervention$§!. \n\n§YЭтот фокус будет очень мощным и значительно быстрее завершится.§!"
 
 error_debug.1.t: "Что-то пошло не так"
 error_debug.1.desc: "Le darn"
 error_debug.2.a: "Oof"
 debug.1.t: "Отладка"
 debug.1.desc: "Это событие запущено для отметки некоторой точки продолжения."
 debug.1.a: "Понял"
 
 debug.2.t: "[FROM.GetName] отправлен в [ROOT.GetName]"
 debug.2.desc: "Хорошо"
 debug.2.a: "Отлично"
 
 new_usa_new_world_market.1.t: "[FROM.GetNameDefCap] приглашает нас в Систему рынка Нового Света"
 new_usa_new_world_market.1.desc: "Нас приглашают вступить в экономический пакт с [FROM.GetName], который будет стимулировать взаимную торговлю и сотрудничество в экономике. Если мы вступим, можно ожидать значительной отдачи от любых наших вложений в альянс."
 new_usa_new_world_market.1.a: "Это достойное начинание"
 new_usa_new_world_market.1.b: "Брать на себя такие обязательства было бы неразумно"
 new_usa_new_world_market.2.t: "[FROM.GetNameDefCap] присоединяется к Системе рынка Нового Света"
 new_usa_new_world_market.2.desc: "Мы только что получили сообщение от нашего [FROM.GetAdjective] посла о том, что [FROM.GetNameDefCap] решила присоединиться к нам в этой новой экономической сфере. Как это повлияет на будущее — ещё предстоит увидеть."
 new_usa_new_world_market.2.a: "Невероятно"
 new_usa_new_world_market.3.t: "[FROM.GetNameDefCap] отказывается вступать в Систему рынка Нового Света"
 new_usa_new_world_market.3.desc: "К сожалению, [FROM.GetNameDefCap] решила, что вступление в наш новый экономический пакт не в её нынешних интересах."
 new_usa_new_world_market.3.a: "Очень жаль"
 
 new_usa_continental_citadel.1.t: "[FROM.GetNameDefCap] приглашает нас в Коалицию «Континентальная цитадель»"
 new_usa_continental_citadel.1.desc: "[FROM.GetNameDefCap] направила приглашение принять участие в совместной оборонной инициативе с целью защиты Западного полушария от внешних угроз — Коалиции «Континентальная цитадель». Если мы вступим, можно ожидать неплохого усиления нашей собственной военной промышленности."
 new_usa_continental_citadel.1.a: "Это в наших интересах"
 new_usa_continental_citadel.1.b: "Мы не вступим"
 new_usa_continental_citadel.2.t: "[FROM.GetNameDefCap] присоединяется к Коалиции «Континентальная цитадель»"
 new_usa_continental_citadel.2.desc: "Мы только что получили сообщение от нашего [FROM.GetAdjective] посла о том, что [FROM.GetNameDefCap] решила присоединиться к нам в этой новой оборонной сфере. Как это повлияет на будущее — ещё предстоит увидеть."
 new_usa_continental_citadel.2.a: "Отлично"
 new_usa_continental_citadel.3.t: "[FROM.GetNameDefCap] отказывается вступать в Коалицию «Континентальная цитадель»"
 new_usa_continental_citadel.3.desc: "К сожалению, [FROM.GetNameDefCap] решила, что вступление в наш новый военно-оборонный пакт не в её нынешних интересах."
 new_usa_continental_citadel.3.a: "Это не идеально"
 
 new_usa_acquire_pacific_territories.0.t: "Мы будем покупать или требовать?"
 new_usa_acquire_pacific_territories.0.desc: "Обращаясь к тем нациям, которые владеют океаническими территориями, которые мы намерены приобрести, — мы попытаемся купить эти земли у них или предъявим на них права?"
 new_usa_acquire_pacific_territories.0.a: "Мы будем покупать их"
 new_usa_acquire_pacific_territories.0.b: "Мы будем требовать их"
 new_usa_acquire_pacific_territories.1.t: "[FROM.GetNameDefCap] предлагает купить наши океанские территории"
 new_usa_acquire_pacific_territories.1.desc: "[FROM.GetNameDefCap] обратилась к нашей администрации с предложением купить территории, которыми мы владеем в континентальной части Океании. [FROM.GetAdjective] посол в [ROOT.GetName] подчеркнул, что их администрация стала очень заинтересована в распространении своего влияния на Тихий океан и рассматривает покупку наших островов там как высокоприоритетную инвестицию для [FROM.GetNameDef]. \nЕсли мы примем передачу земли, они щедро заплатят за сделку. Однако это будет означать передачу значительного влияния на Тихом океане.\n\nКаков наш ответ?"
 new_usa_acquire_pacific_territories.1.a: "Эта сделка в наших интересах."
 new_usa_acquire_pacific_territories.1.b: "Это несправедливый обмен."
 new_usa_acquire_pacific_territories.2.t: "[FROM.GetNameDefCap] соглашается продать тихоокеанские владения"
 new_usa_acquire_pacific_territories.2.desc: "Мы только что получили подтверждение того, что [FROM.GetNameDefCap] приняла наше предложение о покупке её территорий в Океании. Благодаря этим новым владениям [THIS.GetAdjective] влияние распространится дальше по Тихому океану."
 new_usa_acquire_pacific_territories.2.a: "Отлично"
 new_usa_acquire_pacific_territories.3.t: "[FROM.GetNameDefCap] отклоняет продажу тихоокеанских владений"
 new_usa_acquire_pacific_territories.3.desc: "[FROM.GetNameDefCap] отказалась выполнять наше предложение о покупке [FROM.GetAdjective] островных территорий в Тихом океане. К счастью, это предложение было сделано доброжелательно, поэтому никаких дипломатических последствий от их решения не ожидается. Статус-кво сохраняется, хотя [THIS.GetName] ничего не приобрела от этого шага."
 new_usa_acquire_pacific_territories.3.a: "Жаль"
 new_usa_acquire_pacific_territories.4.t: "[FROM.GetNameDefCap] требует передачи тихоокеанских территорий"
 new_usa_acquire_pacific_territories.4.desc: "[FROM.GetNameDefCap] выпустила заявление на имя [THIS.GetAdjective] правительства с требованием уступить наши колониальные владения в Океании и Тихом океане в целях защиты их сферы влияния. Это наглое требование со стороны необычно агрессивной администрации."
 new_usa_acquire_pacific_territories.4.a: "Было бы неразумно делать их нашими врагами"
 new_usa_acquire_pacific_territories.4.b: "Это пустые угрозы"
 new_usa_acquire_pacific_territories.5.t: "[FROM.GetNameDefCap] уступает тихоокеанские территории"
 new_usa_acquire_pacific_territories.5.desc: "[FROM.GetAdjective] администрация согласилась с нашими требованиями и передала свои владения на Тихом океане. Благодаря этим уступкам мы стали сильнее."
 new_usa_acquire_pacific_territories.5.a: "Они сделали правильный выбор"
 new_usa_acquire_pacific_territories.6.t: "[FROM.GetNameDefCap] отказывается уступать территории"
 new_usa_acquire_pacific_territories.6.desc: "В дерзком акте неповиновения [FROM.GetAdjective] правительство решило проигнорировать наши требования и открыто отказалось уступить свои владения на Тихом океане нам. Однако мы чётко обозначили свою позицию по этому вопросу, и, вполне возможно, мы ещё вернёмся."
 new_usa_acquire_pacific_territories.6.a: "Они не понимают, что натворили"
 
 new_usa_liberty_over_east_asia.1.t: "[FROM.GetNameDefCap] требует контроля над нашей внешней политикой"
 new_usa_liberty_over_east_asia.1.desc: "Наша администрация только что получила посланника от [FROM.GetNameDefCap] с уведомлением о том, что они проводят новую политику «свободы над Азией», и в рамках этой новой политики запрашивают контроль над нашей собственной внешней политикой. Хотя подача была мирной и даже причудливой, несколько министров не могли не заметить не столь тонких намёков, которыми пользовались [FROM.GetAdjective] дипломаты. Похоже, их администрация не особенно заинтересована в переговорах по этому вопросу, а скорее требует этого сдвига политики немедленно."
 new_usa_liberty_over_east_asia.1.a: "Возможно, так будет лучше"
 new_usa_liberty_over_east_asia.1.b: "Такая наглость нас не переубедит!"
 new_usa_liberty_over_east_asia.2.t: "[FROM.GetNameDefCap] передаёт контроль над внешней политикой"
 new_usa_liberty_over_east_asia.2.desc: "[FROM.GetAdjective] администрация передала свой ответ нашему посланнику относительно нашей новой позиции во внешней политике, и ответ был полным принятием наших дипломатических устремлений в регионе. Система внешней политики [FROM.GetNameDefCap] теперь под нашим надзором."
 new_usa_liberty_over_east_asia.2.a: "Отлично, это поможет обеспечить наше взаимное процветание"
 new_usa_liberty_over_east_asia.3.t: "[FROM.GetNameDefCap] отказывается передавать нам контроль над внешней политикой"
 new_usa_liberty_over_east_asia.3.desc: "[FROM.GetAdjective] администрация ответила нашей дипломатической делегации карательным отклонением нашего щедрого предложения о взаимном процветании и отказалась продолжать переговоры. Перед нами остаётся лишь один курс действий — мы должны распространить на них свободу силой."
 new_usa_liberty_over_east_asia.3.a: "Значит, силой так силой"
 new_usa_liberty_over_east_asia.3.b: "Мы, пожалуй, зашли слишком далеко"
 new_usa_liberty_over_east_asia.4.t: "[USA.GetNameDefCap] требует сюзеренитета над [FROM.GetNameDefCap]"
 new_usa_liberty_over_east_asia.4.desc: "[USA.GetAdjective] делегация в нашем правительстве сообщила нам, что [USA.GetNameDefCap] поставила себе новую внешнеполитическую цель — обеспечение господства над Восточной Азией и Тихим океаном. В этом стремлении они добиваются от нас передачи контроля над внешней политикой, который мы сейчас осуществляем в отношении [FROM.GetNameDefCap]. Хотя делегация использовала цветистые и кооперативные выражения и много говорила о безопасности, процветании и свободе, наши министры не могли не почувствовать странно агрессивных нот в их подаче. Похоже, их администрация преследует эту цель настойчиво и поэтому вполне может прибегнуть к силе, если мы не уступим."
 new_usa_liberty_over_east_asia.4.a: "Следует поддерживать хорошие отношения с американцами"
 new_usa_liberty_over_east_asia.4.b: "Это прозрачный блеф"
 new_usa_liberty_over_east_asia.5.t: "[FROM.GetNameDefCap] уступает контроль над внешней политикой восточноазиатского государства"
 new_usa_liberty_over_east_asia.5.desc: "Наша делегация в [FROM.GetAdjective] правительстве добилась передачи контроля над одним из их азиатских марионеточных государств нам. Это большой шаг к укреплению нашей гегемонии на Тихом океане."
 new_usa_liberty_over_east_asia.5.a: "Отлично!"
 new_usa_liberty_over_east_asia.6.t: "[FROM.GetNameDefCap] отказалась уступить права на внешнюю политику"
 new_usa_liberty_over_east_asia.6.desc: "Это жёсткое отклонение со стороны [FROM.GetAdjective] правительства означает, что наше стремление к свободе над Восточной Азией неизбежно столкнётся с их собственной политикой. К сожалению, из этого шага, скорее всего, последует конфликт."
 new_usa_liberty_over_east_asia.6.a: "Они нас не остановят"
 new_usa_liberty_over_east_asia.6.b: "Мы переиграли свои карты..."
 
 new_usa_cross_pacific_alliance.1.t: "[FROM.GetNameDefCap] приглашает нас в Трансихоокеанский пакт"
 new_usa_cross_pacific_alliance.1.desc: "Мы получили сообщение от нескольких [FROM.GetAdjective] послов о том, что [FROM.GetNameDefCap] стремится вступить в экономический и оборонный пакт с [THIS.GetNameDefCap] и её союзниками. Очевидно, они считают, что напряжённость, существовавшая между нашими двумя странами, спала, и их уважение к нам налицо. Следует отметить, что принятие этого предложения кардинально изменит наше нынешнее геостратегическое положение. Как следует ответить?"
 new_usa_cross_pacific_alliance.1.a: "Мы не видим причин отказываться!"
 new_usa_cross_pacific_alliance.1.b: "Не в это время, нет"
 new_usa_cross_pacific_alliance.2.t: "[FROM.GetNameDefCap] соглашается вступить с нами в пакт"
 new_usa_cross_pacific_alliance.2.desc: "Наши [FROM.GetAdjective] дипломаты в Вашингтоне подтвердили, что правительство [FROM.GetName] приняло наше предложение о взаимном экономическом и оборонном пакте между нашими нациями и нашими союзниками. Это великий день для Запада!"
 new_usa_cross_pacific_alliance.2.a: "Великолепно!"
 new_usa_cross_pacific_alliance.3.t: "[FROM.GetNameDefCap] отказывается вступать с нами в пакт"
 new_usa_cross_pacific_alliance.3.desc: "К сожалению, несмотря на все усилия наших дипломатов в Токио, [FROM.GetAdjective] администрация вежливо отклонила наше предложение о взаимном экономическом и оборонном пакте между нашими нациями."
 new_usa_cross_pacific_alliance.3.a: "Действительно жаль"
 
 new_usa_protect_the_pacific.1.t: "[FROM.GetNameDefCap] запрашивает доступ к стратегической инфраструктуре"
 new_usa_protect_the_pacific.1.desc: "[FROM.GetNameDefCap] приняла стратегию защиты Тихого океана и в ходе реализации этой политики запросила доступ к нашим военно-морским базам и аэродромам. [FROM.GetAdjective] дипломаты подчеркнули намерение расширить возможности их флотов для патрулирования в поисках враждебных субъектов на морских путях Тихого океана в целях защиты судоходства и инфраструктуры."
 new_usa_protect_the_pacific.1.a: "Это выгодно и нам"
 new_usa_protect_the_pacific.1.b: "Наша инфраструктура открыта не для всех"
 new_usa_protect_the_pacific.2.t: "[FROM.GetNameDefCap] соглашается предоставить доступ к стратегической инфраструктуре"
 new_usa_protect_the_pacific.2.desc: "[FROM.GetAdjective] администрация согласилась с нашим запросом предоставить нам доступ к их военной и судоходной инфраструктуре. Благодаря этим новым точкам на карте дальность и эффективность наших военно-морских патрулей возрастут."
 new_usa_protect_the_pacific.2.a: "Отлично"
 new_usa_protect_the_pacific.3.t: "[FROM.GetNameDefCap] отказывает в доступе к базам"
 new_usa_protect_the_pacific.3.desc: "Несмотря на все наши доводы, [FROM.GetAdjective] правительство не согласилось предоставить нам доступ к их стратегической инфраструктуре. Хотя это не лучшим образом скажется на будущих отношениях между нашими двумя нациями, это всё же лишь незначительная неудача и не должна повлиять на нашу стратегическую обстановку."
 new_usa_protect_the_pacific.3.a: "Ну и ладно"
 
 new_usa_the_firestar_project.1.t: "США предлагают финансировать наши военные усилия"
 new_usa_the_firestar_project.1.desc: "[FROM.GetNameDefCap] обратилась к нашему правительству с очень заманчивым предложением: в обмен на допуск культурных влияний из их страны Америка снабдит нашу армию значительным количеством оружия и укрепит наши военные отрасли современным оборудованием и методами производства. Если мы примем эту сделку, наша война будет practically выиграна, но это повлечёт за собой весьма ощутимое культурное проникновение. Стоит ли оно того?"
 new_usa_the_firestar_project.1.a: "Безусловно"
 new_usa_the_firestar_project.1.b: "Оно того не стоит"
 new_usa_the_firestar_project.2.t: "[FROM.GetNameDefCap] приняла нашу помощь"
 new_usa_the_firestar_project.2.desc: "[FROM.GetAdjective] правительство приняло нашу материальную и интеллектуальную помощь в ведении их оборонительной войны. Следующий шаг — начать снабжать их настоящей горой средств и оружия и активно помогать их военным усилиям. Мы надеемся, что эти усилия также помогут просочиться американской культуре и идеалам в Китай и пробудить там схожие настроения, готовые расцвести после окончания войны."
 new_usa_the_firestar_project.2.a: "Отлично"
 new_usa_the_firestar_project.3.t: "[FROM.GetNameDefCap] отклонила нашу помощь"
 new_usa_the_firestar_project.3.desc: "Хотя мы сделали всё возможное, чтобы подчеркнуть полезность и мудрость принятия нашей помощи, [FROM.GetAdjective] правительство отвергло наши предложения о содействии. Нам остаётся лишь надеяться на лучшее в их войне и что они по возможности доберутся до другого берега."
 new_usa_the_firestar_project.3.a: "Надеемся, они продержатся"
 
 new_usa_alliance_with_a_united_china.1.t: "[FROM.GetNameDefCap] предлагает Договор «Дракон и Орёл»"
 new_usa_alliance_with_a_united_china.1.desc: "[FROM.GetNameDefCap] предложила, чтобы наши две нации вступили в формальный военный альянс, который даст нам стратегическое преимущество над остальным миром, обеспечив американцам контроль над всем полушарием, а нам — территориальный суверенитет над всем Китаем. Предложение весьма смелое и обширное, но и весьма заманчивое."
 new_usa_alliance_with_a_united_china.1.a: "Китай принимает [FROM.GetName] в качестве союзника"
 new_usa_alliance_with_a_united_china.1.b: "Какое нелепое предложение"
 new_usa_alliance_with_a_united_china.2.t: "[FROM.GetNameDefCap] подписала договор"
 new_usa_alliance_with_a_united_china.2.desc: "В этот день между [FROM.GetNameDefCap] и [ROOT.GetNameDefCap] был заключён новый, потрясающий мир альянс. Благодаря этому договору наши две нации готовы обеспечить полный геостратегический контроль над всем этим полушарием, гарантируя нашу взаимную защиту и открывая дверь для того, чтобы наши две нации разделили все возможности экономики, населения, армии и многого другого."
 new_usa_alliance_with_a_united_china.2.a: "Отлично"
 new_usa_alliance_with_a_united_china.3.t: "[FROM.GetNameDefCap] отказалась подписывать договор"
 new_usa_alliance_with_a_united_china.3.desc: "Мы сделали всё возможное, чтобы предложить заманчивое предложение [FROM.GetAdjective] правительству, но похоже, наши усилия оказались тщетными."
 new_usa_alliance_with_a_united_china.3.a: "Жаль..."
 new_usa_alliance_with_a_united_china.0.t: "[USA.GetNameDefCap] и [FROM.GetNameDefCap] образуют Альянс «Дракон и Орёл»"
 new_usa_alliance_with_a_united_china.0.desc: "Сегодня из Вашингтона пришли ошеломительные новости. Между [USA.GetNameDefCap] и [FROM.GetNameDefCap] образован новый военный альянс, что поднимает вопросы о месте Америки в мире и каковы могут быть конечные цели её внешней политики.\n\nЧто получится из этого нового пакта — ещё предстоит увидеть, однако правительственные чиновники по всему миру не сдерживались в выражении общего недовольства этим событием."
 new_usa_alliance_with_a_united_china.0.a: "Понятно"
 
 new_usa_promote_peace.1.t: "[FROM.GetNameDefCap] просит нас подписать Декларацию о прочном мире"
 new_usa_promote_peace.1.desc: "[FROM.GetAdjective] правительство составило свод статей о национальном поведении во внешней политике и разослало их странам Европы. В совокупности они фактически обязывают европейские нации взять на себя обязательство мира и взаимного сотрудничества с соседями, и общий тон декларации — избегать любой ценой новой Великой войны. Подписание поставит нас в хорошие отношения с американцами, но при этом существенно свяжет любые наши усилия по мобилизации нации."
 new_usa_promote_peace.1.a: "Мы за мир"
 new_usa_promote_peace.1.b: "Это просто бессмысленный идеализм"
 new_usa_promote_peace.2.t: "[FROM.GetNameDefCap] подписывает Декларацию о прочном мире"
 new_usa_promote_peace.2.desc: "[FROM.GetNameDefCap] официально поставила подписи под Декларацией, заверив нас и своих соседей в намерении придерживаться доброжелательного и дружеского курса в геополитике. Это шаг к поддержанию мира во всём мире."
 new_usa_promote_peace.2.a: "Хороший день"
 new_usa_promote_peace.3.t: "[FROM.GetNameDefCap] отказывается подписывать Декларацию о прочном мире"
 new_usa_promote_peace.3.desc: "Отказ от подписания декларации, ставший достоянием общественности, [FROM.GetNameDefCap] чётко сигнализирует, что не имеет мирных намерений в отношении мира, а возможно, и самой Америки."
 new_usa_promote_peace.3.a: "Они что, хотят конфликта?"
 
 new_usa_overwhelming_material_support.1.t: "[FROM.GetNameDefCap] предлагает оказать подавляющую материальную поддержку"
 new_usa_overwhelming_material_support.1.desc: "[FROM.GetAdjective] правительство предлагает поддержать нас в наших конфликтах, передав значительную долю своих военных производителей и фабричного производства. Принимать их помощь выглядело бы не лучшим образом, но экономическая выгода действительно была бы нам не лишней."
 new_usa_overwhelming_material_support.1.a: "Мы принимаем"
 new_usa_overwhelming_material_support.1.b: "Мы справимся со своими боями сами"
 new_usa_overwhelming_material_support.2.t: "[FROM.GetNameDefCap] принимает нашу поддержку"
 new_usa_overwhelming_material_support.2.desc: "Наши советники уже запланировали рейсы в Сибирь для поддержки [FROM.GetAdjective] в дальнейшем развитии их военной промышленности. Надеемся, что в ходе этого партнёрства нам удастся помочь им взглянуть на мир нашими глазами."
 new_usa_overwhelming_material_support.2.a: "Посмотрим, к чему это приведёт"
 new_usa_overwhelming_material_support.3.t: "[FROM.GetNameDefCap] отклоняет нашу поддержку"
 new_usa_overwhelming_material_support.3.desc: "Несколько неожиданно, [FROM.GetNameDefCap] отклонила наше предложение помочь им в развитии военной экономики. Они заявили, что полностью контролируют свои военные усилия и не нуждаются в нашей помощи."
 new_usa_overwhelming_material_support.3.a: "Хорошо"
 
 new_usa_new_deal_1.2.t: "Политика «Нового курса»"
 new_usa_new_deal_1.2.desc: "По мере того как экономика страны начинает восстанавливаться, нам нужно решить, как к этому подходить. Будем ли мы жёстко проводить «Новый курс» и насаждать его идеалы или будем использовать его лишь как ориентир?"
 new_usa_new_deal_1.2.a: "Закон о справедливых стандартах труда"
 new_usa_new_deal_1.2.a.tt: "Будет работать к завершению фокуса §Y$USA_new_fair_labour_standards_act$§!. \n\n§YЭтот фокус исторически обоснован и поможет успокоить кризис.§!"
 new_usa_new_deal_1.2.b: "Закон о защите профсоюзов"
 new_usa_new_deal_1.2.b.tt: "Будет работать к завершению фокуса §Y$USA_union_defense_act$§!. \n\n§YЭтот фокус будет более спорным, но и более эффективным.§!"
 
 new_usa_new_deal_2.2.t: "Политика «Нового курса»"
 new_usa_new_deal_2.2.desc: "Экономика страны восстанавливается быстро и эффективно и вскоре вернётся к прежней славе. Следует ли нам добиваться принятия законодательства, которое строит новые дома для тех, кто не может их найти, или принятия законодательства, которое ослабляет ограничения на строительство и делает его возможным?"
 new_usa_new_deal_2.2.a: "Федеральный закон о жилье"
 new_usa_new_deal_2.2.a.tt: "Будет работать к завершению фокуса §Y$USA_new_federal_housing_act$§!. \n\n§YЭтот фокус исторически обоснован и обеспечит нужды американского народа.§!"
 new_usa_new_deal_2.2.b: "Федеральная реформа зонирования"
 new_usa_new_deal_2.2.b.tt: "Будет работать к завершению фокуса §Y$USA_federal_zoning_reform$§!. \n\n§YЭтот фокус сделает акцент на целенаправленном развитии.§!"
 
 new_usa_gold_standard_1.2.t: "Политика финансирования"
 new_usa_gold_standard_1.2.desc: "По мере того как экономика страны начинает восстанавливаться, нам нужно решить, как к этому подходить. Следует ли нам поддерживать более высокие тарифы на импорт, чтобы стимулировать рост внутри нашего рынка, или воспользоваться нашей большой армией для обеспечения рабочих мест и общественных работ?"
 new_usa_gold_standard_1.2.a: "Протекционистские тарифы"
 new_usa_gold_standard_1.2.a.tt: "Будет работать к завершению фокуса §Y$USA_new_protectionist_tariffs$§!. \n\n§YЭтот фокус будет отдавать приоритет экономическому восстановлению.§!"
 new_usa_gold_standard_1.2.b: "Пушки и лопаты"
 new_usa_gold_standard_1.2.b.tt: "Будет работать к завершению фокуса §Y$USA_guns_and_shovels$§!. \n\n§YЭтот фокус направлен на возвращение американцев к работе через военную занятость.§!"
 
 new_usa_gold_standard_2.2.t: "Политика доходов"
 new_usa_gold_standard_2.2.desc: "Экономика страны восстанавливается быстро и эффективно и вскоре вернётся к прежней славе. Что лучше — снизить денежную нагрузку на граждан и реформировать подоходный налог, или улучшить системы оплаты труда и пенсий для военнослужащих?"
 new_usa_gold_standard_2.2.a: "Реформа подоходного налога"
 new_usa_gold_standard_2.2.a.tt: "Будет работать к завершению фокуса §Y$USA_new_income_tax_reform$§!. \n\n§YЭтот фокус приведёт к здоровой экономике.§!"
 new_usa_gold_standard_2.2.b: "Военные пенсии"
 new_usa_gold_standard_2.2.b.tt: "Будет работать к завершению фокуса §Y$USA_military_pensions$§!. \n\n§YЭтот фокус направит восстановление на военное развитие.§!"
 
 new_usa_war_is_business.1.t: "[FROM.GetNameDefCap] предлагает особую торговую сделку за военную поддержку"
 new_usa_war_is_business.1.desc: "[FROM.GetAdjective] правительство направило специальных посланников в их посольство здесь, в нашей столице, передав нашей администрации уникальную торговую сделку по укреплению нашей армии, обороны и военных усилий. Посланники привезли подарки для различных членов нашего высшего кабинета и ведомств — довольно откровенный поступок. Само предложение [FROM.GetAdjective] администрации задумано как нечто более тихое — военно-промышленное партнёрство, которое позволит [ROOT.GetNameDefCap] получить практически полный доступ к оружейному потенциалу [FROM.GetNameDefCap]. Они получат финансовую выгоду, мы выиграем во всех аспектах эффективности нашей армии."
 new_usa_war_is_business.1.a: "Принять предложение"
 new_usa_war_is_business.1.b: "Не сейчас"
 new_usa_war_is_business.2.t: "[FROM.GetNameDefCap] принимает наше первоначальное предложение"
 new_usa_war_is_business.2.desc: "[FROM.GetNameDefCap] сообщила в наше посольство в их столице, что официально принимает наше первоначальное предложение о партнёрстве."
 new_usa_war_is_business.2.a: "Так это начинается..."
 new_usa_war_is_business.3.t: "[FROM.GetNameDefCap] отклоняет наше первоначальное предложение"
 new_usa_war_is_business.3.desc: "На этот раз наши мягкие речи и обширные обещания и предложения не смогли завоевать [FROM.GetAdjective] администрацию."
 new_usa_war_is_business.3.a: "Мы можем подождать..."
 
 new_usa_army_auto_focus_select.1.t: "На чём должна сосредоточиться армия США?"
 new_usa_army_auto_focus_select.1.desc: "По мере того как армия наращивает ряды и берётся за новые задачи, нам нужно определить, куда мы направим усилия по её развитию."
 new_usa_army_auto_focus_select.1.a: "Совершенствовать всю армию"
 new_usa_army_auto_focus_select.1.a_tt: "Это будет значительно дороже"
 new_usa_army_auto_focus_select.1.b: "Инвестировать в офицерский корпус"
 new_usa_army_auto_focus_select.1.b_tt: "Мы подготовим наше командование"
 new_usa_army_auto_focus_select.1.c: "Сосредоточиться на рядовом солдате"
 new_usa_army_auto_focus_select.1.c_tt: "Мы сохраним хребет армии сильным"
