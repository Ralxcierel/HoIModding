 # 动态修正
  USA_economy_dynamic_modifier_great_depression: "大萧条"
  USA_economy_dynamic_modifier_great_depression_desc: "虽然大萧条是全球性现象，但它始于美国的股市崩盘，导致失业率飙升和税收锐减。美国人民和政府已经有足够多的事情要担心，无需再卷入另一场战争。"
  USA_economy_dynamic_modifier_bad: "激烈复苏"
  USA_economy_dynamic_modifier_bad_desc: "经济正在缓慢复苏，但困难尚未结束。"
  USA_government_dynamic_modifier: "联邦政府"
  USA_government_dynamic_modifier_desc: "美国联邦政府由白宫、国会参众两院、最高法院以及这些机构下属的众多联邦机构组成。"
  USA_government_dynamic_modifier_2: "重组的联邦政府"
  USA_government_dynamic_modifier_2_desc: "美国联邦政府已进行重组，以提高效率并履行其宪法职责。"
  USA_economy_dynamic_modifier_good: "美国经济"
  USA_economy_dynamic_modifier_good_desc: "经济正在走向正轨，即将焕发光彩。"
  USA_economy_dynamic_modifier_great: "美国经济"
  USA_economy_dynamic_modifier_great_desc: "美国经济已经苏醒，从大萧条的灰烬中崛起。如今它强大而辉煌，成为世界的灯塔。"
  USA_agency_dynamic_modifier: "OSS"
  USA_agency_dynamic_modifier_desc: "美国对外和对内情报服务均属战略服务局管辖，其影响力与日俱增。"
  USA_agency_dynamic_modifier_2: "CIA"
  USA_agency_dynamic_modifier_2_desc: "中央情报局是美国的对外情报部门，负责在政府专注于自身事务的同时掌控外国对手的事务。"
  USA_mic_dynamic_modifier: "美国军工复合体"
  USA_mic_dynamic_modifier_desc: "建立在美国与生俱来的惊人经济实力之上，军工复合体横跨各行各业数百种利益，全部致力于开发数量更多、效果更强的军事系统。"
  USA_arm_dynamic_modifier: "美国陆军"
  USA_arm_dynamic_modifier_desc: "尽管其历史相对短暂，美国陆军自建国以来一直是一个持续存在的实体。尽管与欧洲和亚洲的传统力量相比经验相对不足，美国陆军已一次又一次地证明了自己。"
  USA_nav_dynamic_modifier: "美国海军"
  USA_nav_dynamic_modifier_desc: "作为一个两侧被大洋环绕的国家，美国海军是该国最重要的资产之一。近几十年来，其力量不断增强，以确保美国国内外利益的安全。"
  USA_air_dynamic_modifier: "美国陆军航空队"
  USA_air_dynamic_modifier_desc: "美国陆军的重要资产。美国的空中力量将主宰天空，使陆军和海军能够迅速解决对手。"
  USA_air_dynamic_modifier_2: "美国空军"
  USA_air_dynamic_modifier_2_desc: "美国军方的新兴重要资产。美国的空中力量将主宰天空、支援地面部队并巡逻海域。"
  USA_economy_dynamic_modifier_great_communist: "美国经济"
  USA_economy_dynamic_modifier_great_communist_desc: "美国人民的经济已经苏醒，从大萧条的灰烬中崛起。如今它强大而辉煌，成为世界的灯塔。"

